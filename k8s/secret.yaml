# ---------------------------------------------------------------------------
# TEMPLATE do Secret da aplicacao. NAO coloque valores reais neste arquivo.
#
# O Secret real NAO e versionado. Crie-o no cluster com:
#
#   kubectl create secret generic oficina-api-secret \
#     --namespace oficina \
#     --from-literal=DATABASE_URL="postgresql+psycopg2://postgres:<SENHA>@<RDS_ENDPOINT>:5432/oficina" \
#     --from-literal=JWT_SECRET_KEY="<CHAVE_JWT>" \
#     --from-literal=INTEGRACAO_API_KEY="<CHAVE_INTEGRACAO>"
#
# O Deployment referencia este Secret pelo nome (oficina-api-secret).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secret
  namespace: oficina
  labels:
    app: oficina-api
type: Opaque
stringData:
  # Placeholders — substituir pelos valores reais no momento do deploy.
  DATABASE_URL: "postgresql+psycopg2://postgres:<SENHA>@<RDS_ENDPOINT>:5432/oficina"
  JWT_SECRET_KEY: "<CHAVE_JWT>"
  INTEGRACAO_API_KEY: "<CHAVE_INTEGRACAO>"
