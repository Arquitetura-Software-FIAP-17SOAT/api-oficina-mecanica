services:
  db:
    image: postgres:16-alpine
    container_name: oficina_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina_app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/oficina
      # Valores de DESENVOLVIMENTO: funcionam sem configurar nada. Em produção, defina no .env.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-segredo-jwt-somente-para-desenvolvimento}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      INTEGRACAO_API_KEY: ${INTEGRACAO_API_KEY:-chave-integracao-somente-para-desenvolvimento}
      SEED_DADOS_EXEMPLO: "true"
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
